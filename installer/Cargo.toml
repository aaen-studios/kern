[package]
name = "kern-installer"
version = "0.1.0"
description = "Standalone Windows installer for kern"
authors = ["kern"]
edition = "2021"
build = "build.rs"

[[bin]]
name = "kern-setup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
zip = "2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
dirs = "6"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem",
] }
