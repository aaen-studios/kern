name: Release

# Push a version tag (v0.3.0) to build every platform, sign the updater
# artifacts, merge the per-platform manifests, and publish a GitHub release.
# `workflow_dispatch` does the same for a version already committed to the repo.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match package.json/tauri.conf.json/Cargo.toml), e.g. 0.3.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve + validate version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          PKG="$(node -p "require('./package.json').version")"
          CONF="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$VERSION" != "$PKG" ] || [ "$VERSION" != "$CONF" ]; then
            echo "::error::release version $VERSION does not match package.json ($PKG) / tauri.conf.json ($CONF) — bump the version files and commit first"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            patchelf \
            build-essential \
            curl wget file

      # Same pinned toolchain as ci.yml / local development (see ci.yml note).
      - uses: dtolnay/rust-toolchain@1.91.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            installer

      - name: Write updater signing key
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATER_KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is not set. Add the contents of src-tauri/updater.key under Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s\n' "$UPDATER_KEY" > src-tauri/updater.key

      - name: Build, sign, and stage release assets
        shell: bash
        env:
          # The standalone installer replaces the NSIS bundle on Windows.
          KERN_CUSTOM_INSTALLER: ${{ runner.os == 'Windows' && '1' || '0' }}
          # Narrow bundles on CI: Linux runners lack the rpm toolchain; macOS
          # only needs the dmg.
          TAURI_BUNDLES: ${{ runner.os == 'Linux' && 'appimage' || runner.os == 'macOS' && 'dmg' || '' }}
          UPDATER_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set +e
          ./deploy.sh 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Surface the failure as a check annotation (job logs need auth).
            MSG=$(tail -n 40 deploy.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g; s/\r//g')
            echo "::error title=Release build failure (${{ matrix.label }})::$MSG"
          fi
          exit "$code"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all platform assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge update manifests
        run: node scripts/merge-update-json.mjs dist dist/update.json

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          # Every staged file except the per-platform fragments (they are
          # merged into update.json and must not be fetched by /latest/).
          mapfile -t ASSETS < <(find dist -maxdepth 1 -type f ! -name 'update-*.json' | sort)
          printf 'Uploading:\n%s\n' "${ASSETS[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "kern $TAG" \
              --generate-notes \
              --verify-tag || \
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "kern $TAG" \
              --generate-notes
          fi

          echo "✓ Released $TAG — updater manifest: https://github.com/${{ github.repository }}/releases/latest/download/update.json"
