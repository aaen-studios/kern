name: site

# kern.aaenz.no (site/) and the agent skill (skills/). Deploys happen on the
# VPS from a push to main; this only checks.
on:
  push:
    branches: [main]
    paths: ["site/**", "skills/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "skills/**", ".github/workflows/site.yml"]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: lint
        run: bun run lint

      - name: typecheck
        # PageProps / RouteContext are generated globals; make them first.
        run: bunx next typegen && bunx tsc --noEmit

      - name: skill references in sync
        run: bun run skill:check

      - name: build
        run: bun run build
        env:
          # Keep CI secretless: the registry falls back to the seed and the
          # release fetch returns null. The Supabase client still needs a URL
          # and key to exist, or /account/plugins throws before it reads
          # cookies and Next tries to prerender it. Placeholders do that.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_TELEMETRY_DISABLED: "1"

  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: validate radar shader
        run: bunx vgpu check lib/radar/radar.wgsl

      - name: radar snapshot
        run: bun run radar:snapshot
