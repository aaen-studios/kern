[package]
name = "kern"
version = "0.5.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# Two binaries ship from this crate (the app + kern-cli); without this, bare
# `cargo run` (what `tauri dev` invokes) can't choose one.
default-run = "kern"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
sysinfo = "0.32"
ureq = { version = "3.3.0", features = ["json"] }
sha2 = "0.10"
chrono = "0.4"
cron = "0.15"
regex = "1"
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "linux-native-sync-persistent",
  "crypto-rust",
] }
getrandom = "0.2"
qrcode = "0.14"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
zip = "2"
flate2 = "1"
tar = "0.4"
walkdir = "2"
tempfile = "3"
notify-debouncer-mini = "0.4"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
ratatui = "0.30.2"
crossterm = "0.29.0"

# Process-tree management for a guaranteed clean stop.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
# Smaller, faster binaries for distribution. Thin LTO keeps release builds
# practical on CI while stripping symbols from shipped artifacts.
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

